services:
  - type: web
    name: telegram-media-suite
    runtime: python
    plan: free
    region: frankfurt
    buildCommand: pip install -r requirements.txt
    startCommand: python3 render_start.py
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.4
      - key: TMD_SUITE_DATA
        value: /opt/render/project/src/.tmd-data
      - key: API_ID
        sync: false
      - key: TELEGRAM_API_ID
        sync: false
      - key: API_HASH
        sync: false
      - key: TELEGRAM_API_HASH
        sync: false
      - key: BOT_TOKEN
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: PHONE
        sync: false
      - key: TELEGRAM_PHONE_NUMBER
        sync: false
      - key: SESSION_STRING
        sync: false
      - key: TELEGRAM_SESSION_STRING
        sync: false
      - key: TMD_SESSION_B64
        sync: false
      - key: TMD_SESSION_B64_FORCE
        value: "false"
      - key: TMD_DASHBOARD_TOKEN
        sync: false
      - key: RENDER_API_KEY
        sync: false
      - key: RENDER_SERVICE_ID
        sync: false
